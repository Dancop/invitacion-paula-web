<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Extractor de Fotogramas — Paula Spa Party</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fdf8f2;
      color: #5a4a58;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .box {
      background: #fff;
      border: 2px solid #e5d9f2;
      border-radius: 20px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(109, 81, 142, 0.12);
    }
    h1 { color: #6d518e; font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; line-height: 1.5; }
    input[type="file"] {
      margin: 1.2rem 0;
      padding: 0.75rem;
      border: 1.5px dashed #9b7ebd;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
    }
    #status {
      font-weight: 700;
      color: #6d518e;
      margin-top: 1rem;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Extractor de Fotogramas WebP</h1>
    <p>Selecciona tu archivo <strong>assets/videos/escena-01.mp4</strong> para convertirlo a fotogramas individuales en resolución original.</p>
    <input type="file" id="videoInput" accept="video/mp4,video/*" />
    <div id="status">Esperando archivo de video...</div>
  </div>

  <script>
    const input = document.getElementById('videoInput');
    const status = document.getElementById('status');

    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.muted = true;
      video.playsInline = true;

      await new Promise((resolve) => {
        video.onloadedmetadata = resolve;
      });

      const fps = 24;
      const totalFrames = Math.floor(video.duration * fps);
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      const zip = new JSZip();

      status.textContent = `Resolución: ${canvas.width}x${canvas.height}\nExtrayendo ${totalFrames} fotogramas...`;

      for (let i = 0; i < totalFrames; i++) {
        video.currentTime = i / fps;
        await new Promise((resolve) => {
          video.onseeked = resolve;
        });

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/webp', 0.88));
        const fileName = `frame-${String(i + 1).padStart(4, '0')}.webp`;
        zip.file(fileName, blob);

        status.textContent = `Procesando fotograma ${i + 1} de ${totalFrames}...`;
      }

      status.textContent = 'Empaquetando ZIP...';
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipBlob);
      link.download = 'escena-01-frames.zip';
      link.click();

      status.textContent = `¡Listo! Se extrajeron ${totalFrames} fotogramas.\nDescomprime "escena-01-frames.zip" dentro de:\nassets/frames/escena-01/`;
      URL.revokeObjectURL(video.src);
    });
  </script>
</body>
</html>
